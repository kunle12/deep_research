<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDL mockup — Add source dialog</title>
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="lcars.css"><script src="frame.js"></script>
</head>
<body data-frame="none">
<div class="overlay">
  <div class="panelcard">
    <div class="cap amber">Add source · Ops <span class="dots"><i></i><i></i><i></i></span></div>
    <div class="body">
      <h2>Add source</h2>
      <p class="sub">Analyze a paper, document or blog post and attach the result
        to this research. Tracked in the bottom taskbar like any research job.</p>
      <div class="field"><label class="flabel">URL</label>
        <input class="tinput mono" placeholder="https://arxiv.org/abs/…"></div>
      <div class="noticebox"><b>http(s) URL required</b> · attaches to
        “Vision-Language-Action Models: A State-of-the-Art Review”</div>
      <div class="actions">
        <button class="pill lilac">Cancel</button>
        <button class="pill amber">Start analysis</button>
      </div>
    </div>
    <div class="foot2"><span class="f1">Attaches to research</span><span class="f2">Ops</span></div>
  </div>
</div>
</body>
</html>
