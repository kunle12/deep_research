<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDL mockup — Create account</title>
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="lcars.css"><script src="frame.js"></script>
</head>
<body data-readout="ALL SYSTEMS NOMINAL · STARDATE 79887.5">
<div class="screen" style="display:grid;place-items:center;overflow:hidden">
  <div class="dotfield"></div>
  <div class="panelcard" style="position:relative;z-index:2">
    <div class="cap">ACCESS PANEL · 02 <span class="dots"><i></i><i></i><i></i></span></div>
    <div class="body">
      <div class="stepper" style="margin-bottom:18px"><i class="on inh">Email</i><i>SSO · soon</i></div>
      <h2>Create account</h2>
      <p class="sub">Join the crew. A verification token is emailed to you —<br>accounts activate only after the address is verified.</p>
      <div class="field"><label class="flabel">Email</label>
        <input class="tinput" value="bob@example.com"></div>
      <div class="field"><label class="flabel">Display name · optional</label>
        <input class="tinput" placeholder="Optional"></div>
      <div class="field"><label class="flabel">Password · min 8 characters</label>
        <input class="tinput" type="password" value="••••••••••••"></div>
      <div class="actions" style="margin-top:14px">
        <button class="pill amber" style="flex:1;justify-content:center;height:46px">Create account</button>
      </div>
      <p class="notice" style="text-align:center;margin-top:14px"><u>← back to sign in</u></p>
    </div>
    <div class="foot2"><span class="f1">Email-verified crew</span><span class="f2">Secure</span></div>
  </div>
</div>
</body>
</html>
