<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDL mockup — Confirm dialog (danger)</title>
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="lcars.css"><script src="frame.js"></script>
</head>
<body data-frame="none">
<div class="overlay">
  <div class="panelcard">
    <div class="cap red">Confirm · Destructive <span class="dots"><i></i><i></i><i></i></span></div>
    <div class="body">
      <h2>Delete report</h2>
      <p class="sub">Delete “Vision-Language-Action Models: A State-of-the-Art Review” and its archived
        files? Its outgoing shares are removed with it. <b>This cannot be undone.</b></p>
      <div class="actions">
        <button class="pill lilac">Cancel</button>
        <button class="pill red">Delete report</button>
      </div>
    </div>
    <div class="foot2"><span class="f-red">This cannot be undone</span><span class="f2">PDL</span></div>
  </div>
</div>
