<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDL mockup — Rename dialog</title>
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="lcars.css"><script src="frame.js"></script>
</head>
<body data-frame="none">
<div class="overlay">
  <div class="panelcard">
    <div class="cap">Rename research <span class="dots"><i></i><i></i><i></i></span></div>
    <div class="body">
      <h2>Rename</h2>
      <p class="sub">Replaces the report title everywhere — library cards, shares and exports.</p>
      <div class="field"><label class="flabel">New name</label>
        <input class="tinput" value="Vision-Language-Action Models: A State-of-the-Art Review"></div>
      <div class="actions">
        <button class="pill lilac">Cancel</button>
        <button class="pill">Save</button>
      </div>
    </div>
    <div class="foot2"><span class="f1">Library</span><span class="f2">Rename</span></div>
  </div>
</div>
</body>
</html>
