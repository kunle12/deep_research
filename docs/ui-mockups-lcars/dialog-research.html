<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDL mockup — New research dialog</title>
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="lcars.css"><script src="frame.js" data-none></script>
</head>
<body data-frame="none">
<div class="overlay">
  <div class="panelcard wide">
    <div class="cap amber">New research · Ops <span class="dots"><i></i><i></i><i></i></span></div>
    <div class="body">
      <h2>New research</h2>
      <p class="sub">The job runs in the background — progress lives in the bottom taskbar;
        the library stays usable while research runs.</p>
      <div class="field"><label class="flabel">Query</label>
        <textarea class="tinput" rows="3">Benchmark VLA generalization across novel embodiments and summarize failure modes.</textarea></div>
      <div class="field"><label class="flabel">Path</label>
        <div class="stepper">
          <button class="on amber">Auto</button><button>Quick</button><button>Deep</button>
          <button>Academic</button><button>URL source</button><button>Applied</button>
        </div></div>
      <div class="actions">
        <button class="pill lilac">Close</button>
        <button class="pill amber">Start research</button>
      </div>
    </div>
    <div class="foot2"><span class="f1">Crew initiated</span><span class="f2">Ops</span></div>
  </div>
</div>
</body>
</html>
