# Deep Research Agent — Example configuration
# Copy to config.yaml and edit. All fields are optional; defaults are sensible.

llm:
  base_url: "http://localhost:8000/v1"   # OpenAI-compatible endpoint
  api_key: "llama.cpp"                    # placeholder; real key via env if needed
  text_model: "qwen3.5-122b"              # your Qwen3.5-122B-A10B text/chat alias
  vision_model: "qwen3.5-122b"            # same model serves vision; route via content blocks
  max_context_tokens: 131072
  timeout_s: 240

agent:
  # "Rich results" preset: wider planner breadth + more critic gap-following
  # rounds. Lower these back to the defaults (3 / 6) for faster, cheaper runs.
  max_iterations: 4               # critic-loop depth cap (3 = default; 4-5 = deeper gap-following)
  max_subquestions: 8             # planner breadth cap (6 = default; 8-10 = wider coverage)
  max_concurrent_tools: 8        # asyncio.Semaphore bound on parallel tool dispatch
  researcher_timeout_s: 5400      # per-researcher wall-clock cap (PDF fetch + LLM turns)
  researcher_max_turns: 16        # per-researcher tool-loop turn budget (must fit researcher_timeout_s: turns x llm.timeout_s + tool I/O)
  tool_timeout_s: 300.0           # hard per-tool-call timeout; 0 disables (not recommended)
  max_subquestion_retries: 3      # max researcher failures per sub-q before forced coverage
  max_refinement_depth: 3         # how deep refinements (chase_reference / drill_deeper) may nest
  max_refinement_per_researcher: 4  # per-researcher refinement budget per iteration
  max_total_refinements_per_iteration: 10  # cap on refinements flushed into the plan each iteration
  classifier:
    enabled: true
    force_path: null             # null | "quick" | "deep" | "academic" | "url_source" | "applied"

search:
  primary: "tavily"
  fallback_chain: ["searxng"]
  tavily:
    api_key_env: "TAVILY_API_KEY"
    search_depth: "advanced"      # "basic" = 1 credit; "advanced" = 2 credits (better recall — recommended)
    max_results: 15               # more candidates per researcher (10 = default)
    rate_limit_retries: 2        # retries on 429 before falling back to SearXNG
    max_calls_per_session: null  # null = unlimited; set to switch to SearXNG proactively
  searxng:
    url: "http://localhost:8080/search"
    fetch_format: "json"
    max_results: 10

browser:
  enabled: true
  mcp_command: "npx"
  mcp_args: ["-y", "@playwright/mcp@latest", "--headless"]
  transport: "stdio"
  mcp_url: null                   # only when transport == "http"

arxiv:
  enabled: true
  max_results_per_query: 15
  download_pdfs: true
  pdf_cache_dir: "./.cache/arxiv_pdfs"
  concurrency: 2                  # global semaphore around arxiv (3s rate limit)
  request_delay_s: 3.0

reddit:
  enabled: false                  # requires `uv sync --extra reddit` + API credentials
  client_id_env: "REDDIT_CLIENT_ID"
  client_secret_env: "REDDIT_CLIENT_SECRET"
  user_agent: "deep_research_bot/0.1"
  max_results_per_query: 25

scholar:
  enabled: true                   # recommended: seeds the academic path from Google Scholar.
                                  # Requires SERPER_API_KEY or a SearXNG instance with the `scholar`
                                  # engine. Missing credentials degrade gracefully to arXiv-only seeds.
  primary: "serper"               # "serper" | "searxng"
  fallback_chain: ["searxng"]
  serper:
    api_key_env: "SERPER_API_KEY"
    max_calls_per_session: null  # null = unlimited; set to switch to SearXNG proactively
  searxng:
    url: "http://localhost:8080/search"
  max_results_per_query: 10
  concurrency: 2                  # Serper ~1 rps on cheapest tier
  request_delay_s: 1.0
  include_pdf_links: true         # parse the free-PDF side link from each hit
  # Optional year window: year_from: 2022, year_to: 2024
  year_from: null
  year_to: null
  # Cost guardrail: skip Scholar when arxiv seeds already return >= this many hits
  skip_if_arxiv_hits_ge: null     # null = always call Scholar

pdf_vision:
  enabled: true
  renderer: "pdf2image"
  poppler_path: null              # null = system PATH
  render_dpi: 150
  max_dim: 1024                   # longest side in px after downscale
  jpeg_quality: 80
  text_extract_first: true        # also run text extraction alongside vision

fetch_page:
  enabled: true
  cache_dir: "./.cache/pages"
  cache_ttl_hours: 168
  user_agent: "DeepResearchBot/0.1 (+https://example.com)"
  request_timeout_s: 30
  min_content_chars_for_browser_fallback: 500

cache:
  diskcache_dir: "./.cache/misc"

output:
  format: "markdown"
  include_citations_bibliography: true

academic:
  enabled: true
  mode: "recursive"               # "flat" (no recursion) | "recursive"
  max_depth: 3                    # citation-graph recursion depth (2 = default; 3 = deeper reference chains)
  max_papers: 30                  # hard cap on total papers analyzed (15 = default; 25-30 recommended for richer surveys)
  concurrency: 3                  # parallel paper processing
  key_reference_threshold: 0.7    # keep >= 0.7: lower values let off-topic keyword-overlap papers into the report
  always_extract_text: true
  seed_count: 10                  # arxiv/scholar seeds per query (5 = default)
  seed_backends: ["arxiv", "scholar"]  # ["arxiv"] | ["arxiv", "scholar"] — scholar covers Nature, ACM, IEEE, conferences (requires `scholar.enabled: true`)
  output_citation_graph: true
  citation_graph_formats: ["bibtex", "json"]
  max_key_references_to_recurse: 8  # per-paper cap on recursed references (5 = default)

url_source:
  enabled: true
  allowed_url_types: ["arxiv", "pdf", "html"]
  fetch_pdf_size_limit_mb: 50
  fetch_html_size_limit_mb: 10
  head_probe_timeout_s: 8
  follow_up_trigger_phrases: []   # extend built-in heuristic
  auto_follow_up: false           # recommended: only on explicit request
  min_content_chars_for_browser_fallback: 500

blog_search:
  enabled: true
  primary: "tavily"                      # "tavily" | "direct" | "both"
  use_domains_fallback: true             # engage direct-domain fetch when Tavily unconfigured
  known_domains: null                    # null = use defaults in blog_search.py
  search_limit: 8                        # max blog posts returned per call
  concurrency: 8                         # HTTP-only, cheaper than PDF
  domain_fallback_per_domain_limit: 3    # cap posts per domain in direct mode
  domain_fallback_min_spacing_ms: 500    # per-host spacing delay
  cross_ref_arxiv: true                  # auto-detect arxiv IDs in blog body
  last_known_good_date: ""               # surface stale-domain warning if older than 90d

pdl:
  enabled: true                          # archive artifacts by default
  root_dir: ".deep_research_library"     # path to library root
  storage:
    backend: "sqlite"                    # "sqlite" | "postgres" (postgres requires asyncpg)
    sqlite:
      wal_mode: true
      busy_timeout_ms: 5000
    postgres_dsn_env: "DEEP_RESEARCH_PG_DSN"
  refresh:
    enabled: true
    stale_after_days_by_source_type:
      arxiv: 365
      blog: 30
      html: 14
      research_report: 0
      scholar: 365               # Scholar results are stable; refresh yearly
    refresh_concurrency: 4
    re_analyze_on_change: true
    notify_on_change: ["log"]
