[project]
name = "deep-research"
version = "0.1.0"
description = "Standalone async Python deep research agent with multimodal LLM support."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
authors = [
    { name = "deep_research authors" },
]
keywords = ["llm", "research", "agent", "qwen", "arxiv", "mcp", "playwright"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # HTTP
    "httpx>=0.27,<1.0",
    # LLM client (OpenAI-compatible — works with any compliant endpoint, e.g. your Qwen service)
    "openai>=1.40,<2.0",
    # Token counting for context management
    "tiktoken>=0.7,<1.0",
    # MCP client (for Playwright MCP browser integration). Pin <2 until SDK v2 stabilizes.
    "mcp>=1.27,<2",
    # HTML article body extraction
    "trafilatura>=1.12,<2.0",
    # PDF text (fast path)
    "pypdf>=4.3,<5.0",
    # PDF text (accuracy fallback for tables / complex layouts)
    "pdfplumber>=0.11,<1.0",
    # PDF page → PNG via poppler subprocess (NOT bundled; AGPL-free)
    "pdf2image>=1.17,<2.0",
    # Image resize for vision token-budget control
    "pillow>=10.0,<12.0",
    # arXiv API client
    "arxiv>=2.1,<3.0",
    # Tavily web search
    "tavily-python>=0.5,<1.0",
    # Pydantic for strict config + state schemas
    "pydantic>=2.7,<3.0",
    # YAML config loading
    "pyyaml>=6.0,<7.0",
    # Disk caching for fetched pages / PDFs (MIT)
    "diskcache>=5.6,<6.0",
    # CLI (CLI layer only — core code doesn't import typer/rich)
    "typer>=0.12,<1.0",
    "rich>=13.7,<14.0",
    # P12(e): FastAPI microservice
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.29,<1.0",
    # P10.5a: Personal Digital Library
    "aiosqlite>=0.20,<1.0",
    "markdown>=3.7,<4.0",
    "weasyprint>=62,<63",
    "pydyf==0.10.0",
]

[project.optional-dependencies]
reddit = [
    "asyncpraw>=8.0,<9.0",
]
pdf-fallback = [
    "xhtml2pdf>=0.2,<0.3",
]
postgres = [
    "asyncpg>=0.29,<1.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
    "python-dotenv>=1.0,<2.0",
    "respx>=0.21,<1.0",  # httpx mock for tests
    "pre-commit>=4.0,<5.0",
]

[project.scripts]
deep-research = "deep_research.cli.app:app"
deep-research-library = "deep_research.library.cli:library_app"
deep-research-scheduler = "deep_research.scheduler:_run_scheduler"

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deep_research"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",   # line length handled by formatter
    "UP042",  # keep `class X(str, Enum)` for stable serialization across 3.11-3.13
    "B008",   # typer.Option/typer.Argument defaults are idiomatic
    "B904",   # raise from err in CLI exit paths makes for noisy tracebacks
    "B905",   # zip() without strict= is fine here; lengths always match
    "SIM108", # allow `if-else` for readability
]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
# Off until P3 — OpenAI SDK has very strict Literal types that fight with
# our "use whatever endpoint" config-agnostic design. Re-enable selectively later.
ignore_errors = true
