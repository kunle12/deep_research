<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Deep Research Library</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233b6fe0'/%3E%3Ctext x='16' y='22' font-size='13' text-anchor='middle' fill='white' font-family='sans-serif'%3EDR%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/styles.css">
  <script type="module" src="/static/js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Deep Research Library home">
      <span class="brand-mark" aria-hidden="true">DR</span>
      <span class="brand-text">Deep Research Library</span>
    </a>
    <div class="search-wrap">
      <input id="global-search" class="search-input" type="search" placeholder="Search reports…" autocomplete="off" aria-label="Search reports">
    </div>
    <div class="topbar-actions">
      <span id="stats" class="stats" aria-live="polite"></span>
      <button id="theme-toggle" class="icon-btn" type="button" title="Toggle light/dark theme" aria-label="Toggle light/dark theme">◐</button>
      <button id="new-research" class="btn btn-primary" type="button">＋ New Research</button>
    </div>
  </header>
  <main id="app"></main>
  <noscript>
    <p class="noscript">This library browser needs JavaScript. The underlying data is available via <a href="/api/reports">/api/reports</a>.</p>
  </noscript>
</body>
</html>
