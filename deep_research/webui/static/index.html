<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Deep Research Library</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23FF9933'/%3E%3Ctext x='16' y='22' font-size='13' text-anchor='middle' fill='%233A2007' font-family='sans-serif' font-weight='bold'%3EDR%3C/text%3E%3C/svg%3E">
  <script src="static/js/theme-init.js"></script>
  <link rel="stylesheet" href="static/styles.css">
  <script type="module" src="static/js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Deep Research Library home">
      <span class="brand-mark" aria-hidden="true">DR</span>
      <span class="brand-text">Deep Research Library</span>
    </a>
    <span class="top-tag" aria-hidden="true">PDL</span>
    <span class="top-clock" id="top-clock" title="Local time">--:--</span>
    <div class="search-wrap">
      <input id="global-search" class="search-input" type="search" placeholder="Search reports…   / to focus" autocomplete="off" aria-label="Search reports">
    </div>
    <div class="topbar-actions">
      <div id="account" class="account"></div>
      <button id="theme-toggle" class="icon-btn" type="button" title="Toggle light/dark theme" aria-label="Toggle light/dark theme">◐</button>
      <button id="new-research" class="btn btn-primary" type="button" aria-label="New research">＋ <span class="nr-label">New research</span></button>
    </div>
  </header>

  <main id="app"></main>

  <footer class="bottomband" aria-label="Library telemetry">
    <div class="bb-seg b1"><span class="led" aria-hidden="true"></span><span id="stats" aria-live="polite">0 reports · 0 artifacts</span></div>
    <div class="bb-seg b2">Tags <b id="telemetry-tags">0</b></div>
    <div class="bb-seg b3"><span id="telemetry-mode">Library online</span></div>
    <a id="nav-shared" class="bb-seg b4 nav-shared" href="#/shared" title="Reports shared with me" hidden>Shared <b id="shared-count">0</b></a>
  </footer>

  <noscript>
    <p class="noscript">This library browser needs JavaScript. The underlying data is available via <a href="api/reports">api/reports</a>.</p>
  </noscript>
</body>
</html>
